{{- if and .Values.tokenSecret.create (not (lookup "v1" "Secret" .Release.Namespace .Values.tokenSecret.name)) }}
# Empty placeholder Secret so the pod can patch it on first write-back
# (kubectl patch on a missing Secret returns 404). The lookup guard avoids
# clobbering an operator-seeded Secret on `helm upgrade`, and the resource
# policy keeps the seeded token across `helm uninstall`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tokenSecret.name }}
  labels:
    {{- include "cronjob.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data: {}
{{- end }}
