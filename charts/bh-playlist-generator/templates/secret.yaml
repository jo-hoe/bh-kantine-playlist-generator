apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "cronjob.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPOTIFY_CLIENT_ID: {{ .Values.secret.data.spotifyClientId }}
  SPOTIFY_CLIENT_SECRET: {{ .Values.secret.data.spotifyClientSecret }}
  SPOTIFY_REDIRECT_URI: {{ .Values.secret.data.spotifyRedirectUri }}
