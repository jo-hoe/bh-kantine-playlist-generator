# Default values for bh-playlist-generator.

# Secret configuration
# SECURITY NOTE: Do not set actual secrets here! Use one of these secure methods:
# 1. Helm Secrets: helm secrets upgrade <release> . -f secrets.yaml
# 2. External Secrets Operator: Create ExternalSecret resource
# 3. Sealed Secrets: Use kubeseal to encrypt secrets
# 4. Kubernetes native: kubectl create secret generic spotify-credentials --from-literal=...
secret:
  name: spotify-credentials
  data:
    # -- Spotify application client ID for API authentication. NEVER commit real values to git!
    spotifyClientId: "your-spotify-client-id"
    # -- Spotify application client secret for API authentication. NEVER commit real values to git!
    spotifyClientSecret: "your-spotify-client-secret"
    # -- Spotify OAuth redirect URI for authentication flow. Example: http://localhost:9090/callback
    spotifyRedirectUri: "your-spotify-redirect-uri"

# -- Jobs configuration: define one or more jobs with independent schedule and settings
jobs:
  - name: default
    # -- Cron schedule for this job. If omitted, defaults to "0 4 * * *"
    schedule: "0 4 * * *"
    # -- Name of the Spotify playlist to update
    playlistName: "Kantine Am Berghain: Next Up"
    # -- Maximum number of tracks to add per artist to avoid playlist domination
    maxTrackNumberPerArtist: "3"
    # -- Location/venue to crawl for events ('kantine' or 'klub')
    location: "kantine"
  
# -- CronJob configuration (global settings applied to all jobs)
# -- NOTE: Per-job scheduling is configured via jobs[].schedule. If omitted, defaults to "0 4 * * *".
cronjob:
  image:
    repository: ghcr.io/jo-hoe/bh-kantine-playlist-generator
    tag: latest
    pullPolicy: IfNotPresent
  restartPolicy: OnFailure
  activeDeadlineSeconds: 3600
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3

# -- Path inside the container where the Spotify token cache file will be stored
cacheFilePath: /app/cache/token_cache.txt
  
# Persistent Volume configuration
persistentVolume:
  name: spotify-cache-pv
  capacity: 1Mi
  accessMode: ReadWriteOnce
  # -- Host path on k3d node where Spotify token cache will be stored
  hostPath: /main/spotify/cache
  type: DirectoryOrCreate

# Persistent Volume Claim configuration
persistentVolumeClaim:
  name: spotify-cache-pvc
  capacity: 1Mi
  accessMode: ReadWriteOnce

# Common labels
labels:
  app: bh-playlist-generator
