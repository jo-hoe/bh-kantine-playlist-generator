name: Close Dependabot prerelease PRs

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close-prerelease:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Close if new version is a prerelease
        if: steps.meta.outputs.package-ecosystem == 'docker'
        run: |
          VERSION="${{ steps.meta.outputs.new-version }}"
          if echo "$VERSION" | grep -qE '[0-9](a|b|rc)[0-9]'; then
            gh pr close "$PR_URL" \
              --comment "Auto-closing: bumps to prerelease Docker tag ($VERSION)" \
              --delete-branch
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
